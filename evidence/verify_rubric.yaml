rubrics:
  - id: 1
    type: f2p
    text: "显式开启断点模式并在后续使用恢复选项时，运行能够读取并继续同一次任务图检查点，而未开启时不会产生或读取该检查点。"
  - id: 2
    type: f2p
    text: "检查点只对根任务调用、解析后的任务定义、有效变量和源文件身份都一致的运行有效。"
  - id: 3
    type: f2p
    text: "只有任务命令、收尾命令、产出物和任务状态都完成后，节点才会以完成状态写入检查点。"
  - id: 4
    type: f2p
    text: "恢复时只跳过仍与检查点一致的已完成节点，处理中断、失败或取消的节点及其受影响的后继会重新执行。"
  - id: 5
    type: f2p
    text: "任务定义、有效变量或源文件变化时，仅受影响的节点及其后继失效，未受影响的有效完成节点仍可复用。"
  - id: 6
    type: f2p
    text: "检查点无法验证时，恢复操作会放弃其中的完成记录并从头执行任务图。"
  - id: 7
    type: f2p
    text: "并行或 failfast 运行在收尾过程中不会发布可被恢复为半完成任务图的检查点。"
  - id: 8
    type: f2p
    text: "任务图成功结束后，旧检查点不再被后续恢复操作复用。"
  - id: 9
    type: p2p
    text: "未开启断点模式的任务执行仍保持原有的依赖、指纹、并行、取消和输出行为。"
